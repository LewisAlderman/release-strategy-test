name: Create New Dev Branch

on:
  push:
    branches:
      - 'v*.*.*@alpha'

jobs:
  create-dev-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from branch name
        id: extract-version
        run: |
          # Extract version from the current alpha branch (e.g., v1.0.0@alpha -> 1.0.0)
          BRANCH_NAME="${{ github.ref_name }}"
          VERSION=$(echo "$BRANCH_NAME" | sed 's/v\([0-9]*\.[0-9]*\.[0-9]*\)@alpha/\1/')
          
          # Split version into major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Increment minor version for new dev branch
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}.0"
          
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_branch_name=v${NEW_VERSION}@dev" >> $GITHUB_OUTPUT
          
          echo "Current version: $VERSION"
          echo "New dev branch: v${NEW_VERSION}@dev"

      - name: Create new dev branch
        run: |
          NEW_BRANCH="${{ steps.extract-version.outputs.new_branch_name }}"
          
          # Create new dev branch from current alpha branch
          git checkout -b "$NEW_BRANCH"
          
          # Push the new branch
          git push origin "$NEW_BRANCH"
          
          echo "Created new dev branch: $NEW_BRANCH"

      - name: Set as default branch
        run: |
          NEW_BRANCH="${{ steps.extract-version.outputs.new_branch_name }}"
          
          # Use GitHub CLI to set the new dev branch as default
          gh repo edit --default-branch "$NEW_BRANCH"
          
          echo "Set $NEW_BRANCH as default branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
